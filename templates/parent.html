<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Bright Mind Tutor — Parent Portal</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .parent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .child-card{cursor:pointer;transition:.18s;border:1px solid var(--border-color)}
    .child-card:hover{transform:translateY(-2px);border-color:var(--primary)}
    .metric{padding:14px;border:1px solid var(--border-color);border-radius:var(--radius-md);background:var(--surface)}
    .metric b{display:block;font-size:1.35rem;margin-top:5px}
  </style>
</head>
<body>
<div class="container" style="max-width:1100px;margin:auto;padding:20px;">
  <div class="top-bar" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:10px"><img src="{{ url_for('static', filename='logo.png') }}" style="width:44px;height:44px;border-radius:10px;object-fit:cover"><div><h1 class="page-title" style="margin:0">Bright Mind Tutor</h1><div class="subtitle">Parent Portal</div></div></div>
    <button class="btn btn-danger" id="logoutBtn">Logout</button>
  </div>

  <div id="loginCard" class="card" style="margin-top:20px">
    <h3>Parent sign in</h3><p class="subtitle">Sign in to view verified children and their progress.</p>
    <input id="email" type="email" autocomplete="email" placeholder="Email" style="width:100%;margin:6px 0;padding:11px">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;margin:6px 0;padding:11px">
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" id="loginBtn">Sign in</button><button class="btn btn-outline" type="button" data-forgot-password>Forgot Password?</button></div><div id="loginError" class="error-text" style="margin-top:8px"></div>
    <hr class="divider">
    <details><summary><strong>New parent? Create an account</strong></summary><form id="parentSignupForm" class="form-vertical" style="margin-top:12px"><input id="parentName" placeholder="Full name" required><input id="parentSignupEmail" type="email" autocomplete="email" placeholder="Email" required><input id="parentSignupPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Password (at least 6 characters)" required><input id="parentSignupConfirm" type="password" autocomplete="new-password" minlength="6" placeholder="Confirm password" required><button class="btn btn-secondary" type="submit" id="parentSignupBtn">Create Parent Account</button><div id="parentSignupStatus" class="subtitle" aria-live="polite"></div></form></details>
  </div>

  <div id="portal" style="display:none;margin-top:20px">
    <div class="parent-grid" style="margin-bottom:15px">
      <div class="card"><div class="subtitle">👨‍👩‍👧 Children</div><div id="childCount" style="font-size:1.8rem;font-weight:700">—</div></div>
      <div class="card"><div class="subtitle">📊 Average</div><div id="overallAverage" style="font-size:1.8rem;font-weight:700">—</div></div>
      <div class="card"><div class="subtitle">📅 Attendance</div><div id="overallAttendance" style="font-size:1.8rem;font-weight:700">—</div></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">👨‍👩‍👧 My Students</h2><p class="subtitle">Only verified parent-child links are shown.</p></div><button class="btn btn-secondary" id="refreshBtn">Refresh</button></div><div id="children" class="parent-grid" style="margin-top:15px"></div></div>
    <div id="detail" class="card" style="display:none;margin-top:15px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 id="childName" style="margin:0">Student</h2><p id="childMeta" class="subtitle"></p></div><button class="btn btn-secondary" id="backBtn">← Back</button></div><div id="metrics" class="parent-grid" style="margin-top:15px"></div><h3 style="margin-top:20px">📚 Topic mastery</h3><div id="topics"></div><h3 style="margin-top:20px">📝 Recent assessments</h3><div id="assessments"></div></div>
  </div>
</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,getIdToken,createUserWithEmailAndPassword} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import {getFirestore,doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAyeZpwu9-FECjC5Qp-lI0OUAblKusxkeI',authDomain:'bright-mind-tutor-app.firebaseapp.com',projectId:'bright-mind-tutor-app',storageBucket:'bright-mind-tutor-app.firebasestorage.app',messagingSenderId:'782512714975',appId:'1:782512714975:web:719e3b7a09ac8c7f9d256a'};
const fbApp=initializeApp(firebaseConfig); const auth=getAuth(fbApp); const db=getFirestore(fbApp); const BMT_PREVIEW_PARAMS=new URLSearchParams(location.search); const BMT_PREVIEW_ROLE=BMT_PREVIEW_PARAMS.get('preview')==='1'&&BMT_PREVIEW_PARAMS.get('role')==='parent'; const BMT_PREVIEW_TOKEN=BMT_PREVIEW_PARAMS.get('token')||'';
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url){const token=await getIdToken(auth.currentUser,true);const r=await fetch(url,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
function metric(label,value){return `<div class="metric"><span class="subtitle">${esc(label)}</span><b>${esc(value??'—')}</b></div>`}
async function loadChildren(){const box=$('children');box.innerHTML='<p class="subtitle">Loading…</p>';try{const d=await api('/api/parent/children');const rows=d.children||[];$('childCount').textContent=rows.length; $('overallAverage').textContent=rows.length?`${Math.round(rows.reduce((a,c)=>a+Number(c.assessmentAverage||0),0)/rows.length)}%`:'—'; $('overallAttendance').textContent=rows.length?`${Math.round(rows.reduce((a,c)=>a+Number(c.attendanceRate||0),0)/rows.length)}%`:'—'; box.innerHTML=rows.length?rows.map(c=>`<div class="card child-card" data-id="${esc(c.id)}"><h3 style="margin-top:0">👤 ${esc(c.name)}</h3><div class="subtitle">${esc(c.grade||'Grade not set')} ${c.className?'· '+esc(c.className):''}</div><div style="margin-top:10px">Risk: <b>${esc(c.riskLevel)}</b></div></div>`).join(''):'<p class="subtitle">No verified students are linked to this parent account.</p>';box.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>loadChild(x.dataset.id));}catch(e){box.innerHTML=`<p class="error-text">${esc(e.message)}</p>`}}
async function loadChild(id){$('detail').style.display='block';$('detail').scrollIntoView({behavior:'smooth'});try{const [a,p] = await Promise.all([api(`/api/parent/children/${encodeURIComponent(id)}/analytics`),api(`/api/parent/children/${encodeURIComponent(id)}/assessments`)]);const c=a.child||{};const x=a.analytics||{};$('childName').textContent=c.name||'Student';$('childMeta').textContent=[c.grade,c.className].filter(Boolean).join(' · ');$('metrics').innerHTML=[metric('Assessment average',x.assessmentAverage!=null?`${x.assessmentAverage}%`:'—'),metric('Attendance',x.attendanceRate!=null?`${x.attendanceRate}%`:'—'),metric('Assignments',x.assignmentCompletion!=null?`${x.assignmentCompletion}%`:'—'),metric('Risk',x.riskLevel||'UNKNOWN')].join('');const topics=x.topicMastery||{};$('topics').innerHTML=Object.keys(topics).length?Object.entries(topics).map(([k,v])=>`<div class="item-row"><div class="item-content"><b>${esc(k)}</b></div><div>${esc(typeof v==='object'?v.percentage??v:v)}%</div></div>`).join(''):'<p class="subtitle">No topic mastery data available yet.</p>';const as=a2=>(a2.assessments||[]);$('assessments').innerHTML=as(p).length?as(p).map(r=>`<div class="item-row"><div class="item-content"><b>${esc(r.title)}</b><div class="subtitle">${esc(r.submittedAt||'')}</div></div><strong>${esc(r.percentage)}%</strong></div>`).join(''):'<p class="subtitle">No submitted assessments found.</p>'}catch(e){$('metrics').innerHTML=`<p class="error-text">${esc(e.message)}</p>`}}
const withTimeout=(promise,ms=15000,msg='Request timed out. Please check your connection and try again.')=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(msg)),ms))]);
$('loginBtn').onclick=async()=>{const btn=$('loginBtn'),err=$('loginError');btn.disabled=true;btn.textContent='Signing in…';err.textContent='';try{await withTimeout(signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value),15000,'Sign-in timed out. Please check your connection and try again.');}catch(e){err.textContent=e?.code==='auth/invalid-credential'?'❌ Invalid email or password.':(e?.message||'❌ Sign-in failed.');}finally{btn.disabled=false;btn.textContent='Sign in'}};
$('parentSignupForm').onsubmit=async e=>{e.preventDefault();const name=$('parentName').value.trim(),email=$('parentSignupEmail').value.trim(),password=$('parentSignupPassword').value,confirm=$('parentSignupConfirm').value,status=$('parentSignupStatus'),btn=$('parentSignupBtn');if(password.length<6){status.textContent='❌ Password must be at least 6 characters.';return}if(password!==confirm){status.textContent='❌ Passwords do not match.';return}btn.disabled=true;status.textContent='Creating account…';try{const cred=await withTimeout(createUserWithEmailAndPassword(auth,email,password),15000,'Parent account creation timed out. Please check your connection and try again.');try{await withTimeout(setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,name,email,class:'',registeredAt:serverTimestamp(),progress:{videos:{},quizzes:{}},payments:[],isAdmin:false,profileImage:'',bio:'',freeTrial:{isActive:true,startedAt:serverTimestamp(),expiresAt:new Date(Date.now()+7*24*60*60*1000).toISOString(),daysRemaining:7,usedDays:0},isPaid:false,accountType:'parent'}),15000,'Parent profile creation timed out. Please check Firebase access and try again.')}catch(profileError){try{await cred.user.delete()}catch(_){}throw profileError}status.textContent='✅ Parent account created. You can now sign in.'}catch(err){status.textContent=err?.code==='auth/email-already-in-use'?'❌ This email is already registered. Please sign in.':`❌ ${err?.message||'Unable to create account.'}`}finally{btn.disabled=false}};
$('logoutBtn').onclick=()=>signOut(auth);$('refreshBtn').onclick=loadChildren;$('backBtn').onclick=()=>$('detail').style.display='none';
function renderParentPreview(){ $('loginCard').style.display='none'; $('portal').style.display='block'; const b=document.createElement('div'); b.className='bmt-preview-banner'; b.innerHTML='<strong>ADMIN PREVIEW</strong> — Parent Dashboard <a href="/admin">Return to Admin</a>'; document.body.prepend(b); $('childCount').textContent='1'; $('overallAverage').textContent='81%'; $('overallAttendance').textContent='93%'; $('children').innerHTML='<div class="card child-card"><h3 style="margin-top:0">👤 Demo Student</h3><div class="subtitle">Grade 8 · 8A</div><div style="margin-top:10px">Risk: <b>LOW</b></div></div>'; } onAuthStateChanged(auth,async u=>{if(BMT_PREVIEW_ROLE){try{const r=await fetch(`/api/admin/preview-verify?role=parent&token=${encodeURIComponent(BMT_PREVIEW_TOKEN)}`);if(!r.ok)throw Error('Preview link is invalid or expired.');renderParentPreview();}catch(e){$('loginError').textContent=e.message;}return;} if(u){$('loginCard').style.display='none';$('portal').style.display='block';loadChildren()}else{$('loginCard').style.display='block';$('portal').style.display='none'}});
</script>
    <script src="{{ url_for('static', filename='password-visibility.js') }}"></script><script src="{{ url_for('static', filename='auth-recovery.js') }}"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js',{scope:'/'}).catch(()=>{}));}</script></body></html>

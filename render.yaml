services:
  - type: web
    name: bright-mind-tutor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 4 --timeout 300
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BMT_VERSION
        value: 31.108
      - key: BMT_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: PASSWORD_RESET_CONTINUE_URL
        sync: false
      - key: DIAGNOSTIC_KEY
        sync: false
      - key: BMT_BASE_URL
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_CURRENCY
        value: "ETB"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_VISION_MODEL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_MAX_MESSAGE_LENGTH
        value: "3500"
      - key: TELEGRAM_MODERATOR_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MODERATOR_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_PUBLISHER_BOT_TOKEN
        sync: false
      - key: TELEGRAM_PUBLISHER_WEBHOOK_SECRET
        sync: false
      - key: BMT_SCHEDULER_SECRET
        sync: false
      - key: ADMIN_PREVIEW_SECRET
        sync: false
      - key: BMT_CERT_VERIFY_SECRET
        sync: false
      - key: FCM_VAPID_KEY
        sync: false
      - key: TELEBIRR_WEBHOOK_SECRET
        sync: false
      - key: CBE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
